# Deploy preview via GHCR + Docker Compose (guessu-style).
#
# Required GitHub secrets:
#   SERVER_HOST          — VPS hostname or IP (existing)
#   SERVER_USER          — SSH user (existing)
#   SSH_PRIVATE_KEY      — Private key for SERVER_USER (existing)
#   DISCORD_WEBHOOK      — Discord webhook URL (existing)
#   DEPLOY_PATH_PREVIEW  — Absolute path on VPS for the preview clone
#   GHCR_PULL_TOKEN      — PAT with read:packages (for private GHCR images on the VPS)
#
# Optional:
#   DEPLOY_SSH_PORT — SSH port (default 22)
#
# Skip deploy by including `--skip-deploy` in the commit message.
#
# Preview gateway listens on host port 8089. Images are tagged with a `preview-`
# prefix so they do not overwrite production `:latest`.

name: Deploy to Preview

on:
    workflow_dispatch:
        inputs:
            reason:
                description: Reason for preview deployment
                required: false
                type: string
    push:
        branches: [preview, "preview/*"]

concurrency:
    group: deploy-preview
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    MODE: preview

jobs:
    check-deploy:
        runs-on: ubuntu-latest
        outputs:
            skip: ${{ steps.skip_check.outputs.skip }}
        steps:
            - name: Check for --skip-deploy flag
              id: skip_check
              env:
                  GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
              run: |
                  echo "Commit message:"
                  echo "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE"
                  if echo "$GITHUB_EVENT_HEAD_COMMIT_MESSAGE" | grep -q -- "--skip-deploy"; then
                    echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

    notify-start:
        needs: check-deploy
        if: needs.check-deploy.outputs.skip == 'false'
        runs-on: ubuntu-latest
        steps:
            - name: Send Deploy Start Notification
              uses: sarisia/actions-status-discord@v1
              if: always()
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  noprefix: true
                  title: "🔄 Preview Deployment Started"
                  description: |
                      Starting deployment to preview...
                      - Branch: `${{ github.ref_name }}`
                      - Reason: `${{ github.event.inputs.reason || github.event.head_commit.message || 'Manual preview deploy' }}`
                  color: 0xff8c00

    build-and-push:
        needs: [check-deploy, notify-start]
        if: needs.check-deploy.outputs.skip == 'false'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                include:
                    - name: server
                      dockerfile: docker/Dockerfile.server
                    - name: jobs
                      dockerfile: docker/Dockerfile.jobs
                    - name: client
                      dockerfile: docker/Dockerfile.client
        steps:
            - uses: actions/checkout@v4

            - name: Image name
              id: meta
              run: |
                  owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
                  short_sha=$(echo '${{ github.sha }}' | cut -c1-7)
                  echo "image=${{ env.REGISTRY }}/${owner}/${repo}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
                  echo "sha_tag=preview-sha-${short_sha}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  target: prod
                  push: true
                  build-args: |
                      MODE=${{ env.MODE }}
                      COMMIT_SHA=${{ github.sha }}
                      BRANCH_NAME=${{ github.ref_name }}
                  tags: |
                      ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
                      ${{ steps.meta.outputs.image }}:preview-latest
                  cache-from: type=gha,scope=${{ matrix.name }}-preview
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}-preview

    deploy:
        needs: [check-deploy, build-and-push]
        if: needs.check-deploy.outputs.skip == 'false'
        runs-on: ubuntu-latest
        environment:
            name: preview
        steps:
            - name: Image refs
              id: images
              run: |
                  owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
                  repo=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
                  short_sha=$(echo '${{ github.sha }}' | cut -c1-7)
                  base="${{ env.REGISTRY }}/${owner}/${repo}"
                  echo "server=${base}/server:preview-sha-${short_sha}" >> "$GITHUB_OUTPUT"
                  echo "jobs=${base}/jobs:preview-sha-${short_sha}" >> "$GITHUB_OUTPUT"
                  echo "client=${base}/client:preview-sha-${short_sha}" >> "$GITHUB_OUTPUT"

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1.2.0
              env:
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_PREVIEW }}
                  DEPLOY_SHA: ${{ github.sha }}
                  GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  TC_SERVER_IMAGE: ${{ steps.images.outputs.server }}
                  TC_JOBS_IMAGE: ${{ steps.images.outputs.jobs }}
                  TC_CLIENT_IMAGE: ${{ steps.images.outputs.client }}
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
                  envs: DEPLOY_PATH,DEPLOY_SHA,GHCR_PULL_TOKEN,GHCR_USER,TC_SERVER_IMAGE,TC_JOBS_IMAGE,TC_CLIENT_IMAGE
                  script: |
                      set -euo pipefail
                      cd "$DEPLOY_PATH"

                      echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

                      if [ ! -d .git ]; then
                        echo "DEPLOY_PATH_PREVIEW must be a git clone of this repo"
                        exit 1
                      fi
                      if [ ! -f config.json ]; then
                        echo "config.json missing at DEPLOY_PATH_PREVIEW — create it before deploying"
                        exit 1
                      fi

                      echo "Syncing git repo to ${DEPLOY_SHA}"
                      git fetch origin
                      git reset --hard "$DEPLOY_SHA"
                      git clean -fd -e config.json -e checklist.json -e .images.env -e .env -e .env.*
                      echo "Repo now at: $(git rev-parse --short HEAD) — $(git log -1 --oneline)"

                      printf '%s\n' \
                        "TC_SERVER_IMAGE=${TC_SERVER_IMAGE}" \
                        "TC_JOBS_IMAGE=${TC_JOBS_IMAGE}" \
                        "TC_CLIENT_IMAGE=${TC_CLIENT_IMAGE}" \
                        "TC_PULL_POLICY=always" \
                        > .images.env

                      set -a
                      # shellcheck disable=SC1091
                      source .images.env
                      set +a

                      echo "Deploying preview images:"
                      echo "  server=${TC_SERVER_IMAGE}"
                      echo "  jobs=${TC_JOBS_IMAGE}"
                      echo "  client=${TC_CLIENT_IMAGE}"

                      docker image prune -af

                      docker compose -f docker-compose.preview.yml pull server jobs client
                      docker compose -f docker-compose.preview.yml up -d --remove-orphans --pull always --force-recreate \
                        server jobs client gateway

                      docker image prune -af

                      echo "Running containers:"
                      docker compose -f docker-compose.preview.yml ps
                      docker compose -f docker-compose.preview.yml images server jobs client

    notify:
        needs: [check-deploy, build-and-push, deploy]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Send Discord Notification
              uses: sarisia/actions-status-discord@v1
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  noprefix: true
                  title: >-
                      ${{ needs.check-deploy.outputs.skip == 'true' && '⏭️ Preview Deployment Skipped' ||
                          (needs.deploy.result == 'success' && '✅ Preview Deployment Successful') ||
                          '❌ Preview Deployment Failed' }}
                  description: >-
                      ${{ needs.check-deploy.outputs.skip == 'true'
                          && 'Preview deployment was skipped due to `--skip-deploy` flag in commit message.'
                          || format('- Build: `{0}`\n- Deploy: `{1}`\n- Branch: `{2}`\n- Reason: `{3}`',
                              needs.build-and-push.result,
                              needs.deploy.result,
                              github.ref_name,
                              github.event.inputs.reason || github.event.head_commit.message || 'Automated preview deploy') }}
                  color: >-
                      ${{ needs.check-deploy.outputs.skip == 'true' && '0xffff00' ||
                          (needs.deploy.result == 'success' && '0x1df27d') || '0xff5050' }}
                  content: >-
                      ${{ needs.deploy.result != 'success' && needs.check-deploy.outputs.skip != 'true'
                          && '⚠️ preview deploy failed! <@341321481390784512>' || '' }}
