name: Deploy to Staging

on:
    workflow_dispatch:
        inputs:
            reason:
                description: "Reason for staging deployment"
                required: false
                type: string
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: staging

        steps:
            - name: Send Deploy Start Notification
              uses: sarisia/actions-status-discord@v1
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  status: info
                  title: "🚀 Staging Deployment Started"
                  description: |
                      Starting deployment to staging environment
                      Reason: ${{ github.event.inputs.reason || github.event.head_commit.message || 'Automated deploy' }}
                      Triggered by: ${{ github.actor }}
                  color: 0x3498db

            - name: Verify Dependencies
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "Checking dependencies..."
                      echo "========================"

                      # Node.js check and install
                      if ! command -v node &> /dev/null; then
                          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - 
                          sudo apt-get install -y nodejs
                      fi

                      # Check Yarn
                      if ! command -v yarn &> /dev/null; then
                          echo "Installing Yarn..."
                          npm install -g yarn
                      fi

                      # PM2 check
                      if ! command -v pm2 &> /dev/null; then
                          npm install -g pm2
                      fi

            - name: List Current PM2 Processes
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      echo "List of current pm2 processes:"
                      echo "==============================="
                      pm2 ls

            - name: Pull Changes & Build
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.SERVER_HOST }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      # Pull latest changes
                      cd ~/projects/tournament-tracker || { echo "Directory not found"; exit 1; }
                      git pull

                      # Install dependencies
                      echo "Installing dependencies..."
                      yarn install

                      # Build both frontend and backend
                      echo "Building project..."
                      yarn build

                      # Reload service
                      echo "Reloading service..."
                      pm2 reload staging-tcomm || pm2 start "yarn prod" --name staging-tcomm

                      # Ensure it's running
                      sleep 5
                      pm2 ls

                      # Show initial logs
                      echo "Success! Showing startup logs for 10 seconds..."
                      sleep 3
                      timeout 10 pm2 logs staging-tcomm --lines 50 || true
                      exit 0

    notify:
        needs: deploy
        runs-on: ubuntu-latest
        if: always()
        steps:
            - name: Send Discord Notification
              uses: sarisia/actions-status-discord@v1
              if: always()
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  status: ${{ needs.deploy.result }}
                  title: ${{ needs.deploy.result == 'success' && '🚀 Staging Deployment Successful' || '❌ Staging Deployment Failed' }}
                  description: |
                      Staging deployment ${{ needs.deploy.result }}
                      Reason: ${{ github.event.inputs.reason || github.event.head_commit.message || 'Automated deploy' }}
                  color: ${{ needs.deploy.result == 'success' && '0x1df27d' || '0xff5050' }}
