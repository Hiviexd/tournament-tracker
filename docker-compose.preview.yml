services:
  server:
    image: ${TC_SERVER_IMAGE:-tc-server-preview:local}
    pull_policy: ${TC_PULL_POLICY:-missing}
    environment:
      NODE_ENV: preview
      PORT: 3000
      SERVE_CLIENT: "false"
    volumes:
      - ./config.json:/app/config.json:ro
    restart: unless-stopped

  client:
    image: ${TC_CLIENT_IMAGE:-tc-client-preview:local}
    pull_policy: ${TC_PULL_POLICY:-missing}
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "8089:80"
    volumes:
      - ./docker/nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
